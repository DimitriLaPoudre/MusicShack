services:
  server:
    build: .
    container_name: server
    ports:
      - "8080:8080"
    env_file: .env

  postgres:
    build: ./postgres
    container_name: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}

volumes:
  pg_data:
  minio_data:
  rabbitmq_data:
